<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Marko Stankovic">
  <!-- The mark, ticket map-site-v2/11 (2026-08-15): the `>` chevron alone, teal on paper.
       Same glyph as SiteNav.astro's `> ms` wordmark. The aurora band, the seven rays and
       the amber sun are gone: a favicon gets one shape.

       Geometry is measured off the wordmark's own font rather than eyeballed. Real
       JetBrains Mono 600 (what SiteNav loads) draws `>` with an ink box of 178x218,
       aspect 0.8165, stroke/height 0.156. This drawing: ink box 268x328 = 0.817, stroke
       52/328 = 0.159. Side by side with the wordmark it is the same mark, not a heavier
       cousin.

       Stroke 52/512 renders 1.63px at a 16px tab. That was measured, not assumed — a
       16px bake-off at 52 / 60 / 68 was near-indistinguishable, which is why the weight
       could be matched to the wordmark instead of inflated for legibility.

       Ink stays inside the Android maskable safe circle (204.8 radius): the far arm-end
       cap sits at radius 201.2, the apex at 134. That bound is what caps the size — the
       chevron cannot grow further without being cropped on Android.

       THIS FILE IS THE SOURCE. Every raster in the set comes from it via
       scripts/render-icons.sh — do not hand-edit a PNG. -->
  <!-- Tile is #EAE7DF, deliberately NOT the page background token #FBFAF7. Paper on paper made
       the tile invisible against a light browser tab strip, so the icon read as a chevron
       floating loose in the chrome. #EAE7DF is the darkest warm paper that still clears WCAG AA
       (4.67) against the teal; one notch further, the border token #E4E0D8, measures 4.38.
       Not a CSS token on purpose: this is an asset, not a surface, and no stylesheet reads it.
       (No double hyphens in here. XML forbids them inside a comment and rsvg refuses the file.) -->
  <rect id="tile" width="512" height="512" rx="112" fill="#EAE7DF"/>
  <path d="M148 118 L345 256 L148 394"
        fill="none"
        stroke="#14707C"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="miter"/>
</svg>
