<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840" role="img" aria-labelledby="t d">
<title id="t">The seam model before and after the redesign</title>
<desc id="d">Two columns. Before: the upper and lower slab each carry a torn edge ramping to a shared junction color, so the boundary shows two tears with a wedge of junction color between them, read as stacked cards. After: the upper slab ends flat in its own color, the lower slab is painted in that same color above its one torn edge, and the slab boundary becomes invisible. Ten pixels of flat color at each slab end insure the crop.</desc>
