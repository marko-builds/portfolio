<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="t d">
<title id="t">Three ways to reach the guard</title>
<desc id="d">Three rows. A test imports the module and the guard is false by design. A dev run matches both sides and the guard is true. A user run through the bin symlink mismatches and the guard is false, so nothing runs. No test takes the third row.</desc>
<style>
 .bg{fill:#12151C}
 .p{fill:#0B0E15;stroke:#2A3242;stroke-width:2;rx:6}
 .b{fill:#12151C;stroke:#2A3242;stroke-width:2;rx:6}
 .k{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB;letter-spacing:.08em}
 .ttl{font:600 34px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#E4E9EC}
 .lab{font:600 28px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#E4E9EC}
 .sub{font:400 26px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#8792A0}
 .mono{font:400 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#E4E9EC}
 .dim{font:400 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8792A0}
 .cy{fill:#5FCEDB}
 .am{fill:#D99A5E}
 .cyt{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB}
 .amt{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#D99A5E}
</style>
<rect class="bg" width="720" height="760"/>
<text class="k" x="16" y="36">WHO RUNS THE GUARD</text>
<text class="ttl" x="16" y="76">Three ways to reach the guard</text>
<rect class="p" x="16" y="100" width="688" height="180"/>
<text class="lab" x="32" y="140">a test imports index.ts</text>
<text class="mono" x="32" y="180">argv[1] is a vitest worker</text>
<text class="cyt" x="32" y="216">guard false, as a test wants</text>
<text class="sub" x="32" y="252">the test calls buildProgram() itself</text>
<rect class="p" x="16" y="300" width="688" height="180"/>
<text class="lab" x="32" y="340">dev: node dist/index.js</text>
<text class="mono" x="32" y="380">both sides hold the same path</text>
<text class="cyt" x="32" y="416">guard true, parse() runs</text>
<text class="sub" x="32" y="452">every dev run looked fine</text>
<rect x="16" y="500" width="688" height="180" fill="#0B0E15" stroke="#D99A5E" stroke-width="2" rx="6"/>
<text class="lab" x="32" y="540">user: node_modules/.bin/changelogue</text>
<text class="mono" x="32" y="580">symlink on one side, file on the other</text>
<text class="amt" x="32" y="616">guard false, exit 0, no output</text>
<text class="sub" x="32" y="652">the only row a user sees</text>
<text class="sub" x="16" y="728">No test takes the third row. None can.</text>
</svg>
