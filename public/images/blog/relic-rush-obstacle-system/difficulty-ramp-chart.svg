<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d">
<title id="t">Obstacle difficulty weights across checkpoint ranges</title>
<desc id="d">Checkpoints 1 to 2 are 100 percent Easy. Checkpoints 3 to 4 are 70 percent Easy and 30 percent Medium. Checkpoint 5 and beyond is 30 percent Easy, 50 percent Medium and 20 percent Hard. Hard never exceeds 20 percent.</desc>
<style>
 .ax{font:400 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .val{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0B0E15}
 .leg{font:400 12.5px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .note{font:400 12.5px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
</style>
<g>
 <rect x="16" y="16" width="12" height="12" fill="#3E7A85" rx="2"/><text class="leg" x="36" y="26">Easy</text>
 <rect x="96" y="16" width="12" height="12" fill="#5FB8C7" rx="2"/><text class="leg" x="116" y="26">Medium</text>
 <rect x="188" y="16" width="12" height="12" fill="#8FEAF5" rx="2"/><text class="leg" x="208" y="26">Hard</text>

 <text class="ax" x="16" y="92">Checkpoint 1 - 2</text>
 <rect x="180" y="70" width="660" height="34" fill="#3E7A85" rx="4"/>
 <text class="val" x="196" y="92">100</text>

 <text class="ax" x="16" y="164">Checkpoint 3 - 4</text>
 <rect x="180" y="142" width="460" height="34" fill="#3E7A85" rx="4"/>
 <rect x="642" y="142" width="198" height="34" fill="#5FB8C7" rx="4"/>
 <text class="val" x="196" y="164">70</text><text class="val" x="658" y="164">30</text>

 <text class="ax" x="16" y="236">Checkpoint 5+</text>
 <rect x="180" y="214" width="196" height="34" fill="#3E7A85" rx="4"/>
 <rect x="378" y="214" width="328" height="34" fill="#5FB8C7" rx="4"/>
 <rect x="708" y="214" width="132" height="34" fill="#8FEAF5" rx="4"/>
 <text class="val" x="196" y="236">30</text><text class="val" x="394" y="236">50</text><text class="val" x="724" y="236">20</text>

 <line x1="180" y1="270" x2="840" y2="270" stroke="#2A3242" stroke-width="1"/>
 <text class="ax" x="180" y="290">0</text><text class="ax" x="828" y="290">100</text>
 <text class="ax" x="510" y="290" text-anchor="middle">selection weight (%)</text>
 <text class="note" x="16" y="322">Hard stays at 20 percent even at checkpoint 5+. It is pressure, not the default.</text>
</g></svg>
