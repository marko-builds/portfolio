<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t2 d2">
<title id="t2">Minimum spawn distance scales with scroll speed</title>
<desc id="d2">At 8 metres per second or less, an obstacle spawns 12 units ahead for 1.5 seconds of lead time. Between 8 and 12 metres per second, 20 units for 2 seconds. Above 12 metres per second, 30 or more units for 2.5 seconds. Spawn distance is speed multiplied by lead time, so the reading window stays constant.</desc>
<style>
 .ax{font:400 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .u{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#E4E9EC}
 .lt{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#D99A5E}
 .note{font:400 12.5px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .pl{font:600 11px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#5FCEDB}
</style>
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#E4E9EC"/></marker></defs>
<g>
 <line x1="150" y1="52" x2="150" y2="258" stroke="#5FCEDB" stroke-width="2"/>
 <text class="pl" x="150" y="42" text-anchor="middle">PLAYER</text>

 <text class="ax" x="16" y="94">&#8804; 8 m/s</text>
 <line x1="150" y1="88" x2="374" y2="88" stroke="#3E7A85" stroke-width="10" stroke-linecap="round" marker-end="url(#a2)"/>
 <text class="u" x="390" y="93">12 units</text><text class="lt" x="470" y="93">1.5s lead</text>

 <text class="ax" x="16" y="164">8 - 12 m/s</text>
 <line x1="150" y1="158" x2="523" y2="158" stroke="#5FB8C7" stroke-width="10" stroke-linecap="round" marker-end="url(#a2)"/>
 <text class="u" x="539" y="163">20 units</text><text class="lt" x="619" y="163">2.0s lead</text>

 <text class="ax" x="16" y="234">&gt; 12 m/s</text>
 <line x1="150" y1="228" x2="710" y2="228" stroke="#8FEAF5" stroke-width="10" stroke-linecap="round" marker-end="url(#a2)"/>
 <text class="u" x="726" y="233">30+ units</text><text class="lt" x="726" y="251">2.5s lead</text>

 <text class="note" x="16" y="292">minSpawnDistance = currentScrollSpeed &#215; minimumLeadTime</text>
 <text class="note" x="16" y="314">The distance moves so the reading window does not. At any speed the player gets the same time to respond.</text>
</g></svg>
