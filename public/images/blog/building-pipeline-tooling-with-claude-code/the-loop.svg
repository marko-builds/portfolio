<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
<title id="t">The loop around the model: align, red, green, verify</title>
<desc id="d">Four stages in sequence. Align on a one page spec, write one failing test, make it pass, then verify against evidence. A return arc runs from verify back to the failing test for the next slice. A gate below reads: done is a passing check, never "it looks correct".</desc>
<style>
 .n{fill:#12151C;stroke:#2A3242;stroke-width:1.5;rx:4}
 .lab{font:600 15px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .sub{font:400 12.5px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .k{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB;letter-spacing:.08em}
 .arc{font:400 12px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .gate{font:600 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#D99A5E}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5A6675"/></marker></defs>
<g>
 <rect class="n" x="16" y="74" width="188" height="80"/><text class="k" x="32" y="98">01</text><text class="lab" x="32" y="120">Align</text><text class="sub" x="32" y="140">one page spec first</text>
 <rect class="n" x="234" y="74" width="188" height="80"/><text class="k" x="250" y="98">02</text><text class="lab" x="250" y="120">One failing test</text><text class="sub" x="250" y="140">the spec it cannot talk past</text>
 <rect class="n" x="452" y="74" width="188" height="80"/><text class="k" x="468" y="98">03</text><text class="lab" x="468" y="120">Make it pass</text><text class="sub" x="468" y="140">one behaviour, nothing else</text>
 <rect class="n" x="670" y="74" width="188" height="80" style="stroke:#5FCEDB"/><text class="k" x="686" y="98">04</text><text class="lab" x="686" y="120">Verify</text><text class="sub" x="686" y="140">deterministic build</text>
 <path d="M208 114 H230" stroke="#5A6675" stroke-width="1.5" marker-end="url(#a)"/>
 <path d="M426 114 H448" stroke="#5A6675" stroke-width="1.5" marker-end="url(#a)"/>
 <path d="M644 114 H666" stroke="#5A6675" stroke-width="1.5" marker-end="url(#a)"/>
 <path d="M764 158 V196 H328 V158" fill="none" stroke="#3E7A85" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
 <text class="arc" x="546" y="212" text-anchor="middle">next slice</text>
 <rect x="16" y="246" width="842" height="60" fill="#12151C" stroke="#2A3242" stroke-width="1.5" rx="4"/>
 <text class="gate" x="36" y="272">The agent does not decide a slice is done. A passing check does.</text>
 <text class="sub" x="36" y="292">The loop is also a ceiling: the agent is only ever as good as the check that grades it.</text>
</g></svg>
