<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-labelledby="t d">
<title id="t">The loop around the model: align, red, green, verify</title>
<desc id="d">Four stages in sequence. Align on a one page spec, write one failing test, make it pass, then verify against evidence. A return arc runs from verify back to the failing test for the next slice. A gate below reads: done is a passing check, never "it looks correct".</desc>
<style>
 .n{fill:#12151C;stroke:#2A3242;stroke-width:2;rx:6}
 .ttl{font:600 34px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .lab{font:600 30px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .sub{font:400 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .k{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB;letter-spacing:.08em}
 .arc{font:400 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .gate{font:600 28px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#D99A5E}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5A6675"/></marker></defs>
<text class="k" x="16" y="36">THE LOOP</text>
<text class="ttl" x="16" y="76">Align, one failing test, pass, verify</text>
<g transform="translate(0,100)">
 <rect class="n" x="16" y="24" width="600" height="110"/><text class="k" x="36" y="60">01</text><text class="lab" x="36" y="94">Align</text><text class="sub" x="36" y="124">one page spec first</text>
 <rect class="n" x="16" y="174" width="600" height="110"/><text class="k" x="36" y="210">02</text><text class="lab" x="36" y="244">One failing test</text><text class="sub" x="36" y="274">the spec it cannot talk past</text>
 <rect class="n" x="16" y="324" width="600" height="110"/><text class="k" x="36" y="360">03</text><text class="lab" x="36" y="394">Make it pass</text><text class="sub" x="36" y="424">one behaviour, nothing else</text>
 <rect class="n" x="16" y="474" width="600" height="110" style="stroke:#5FCEDB"/><text class="k" x="36" y="510">04</text><text class="lab" x="36" y="544">Verify</text><text class="sub" x="36" y="574">deterministic build</text>
 <path d="M316 134 V170" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
 <path d="M316 284 V320" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
 <path d="M316 434 V470" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
 <path d="M616 529 H664 V229 H620" fill="none" stroke="#3E7A85" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
 <text class="arc" transform="rotate(-90 702 379)" x="702" y="379" text-anchor="middle">next slice</text>
 <rect x="16" y="624" width="688" height="152" fill="#12151C" stroke="#2A3242" stroke-width="2" rx="6"/>
 <text class="gate" x="36" y="664">The agent does not decide a slice is done.</text>
 <text class="gate" x="36" y="698">A passing check does.</text>
 <text class="sub" x="36" y="736">The loop is also a ceiling: the agent is only</text>
 <text class="sub" x="36" y="764">ever as good as the check that grades it.</text>
</g></svg>
