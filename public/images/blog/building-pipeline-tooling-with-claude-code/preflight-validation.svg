<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-labelledby="t d">
<title id="t">The pre-flight report: four checks that run before an asset is trusted</title>
<desc id="d">Four validation checks with their real thresholds. Triangle budget 300 to 1500 for props. Longest axis between 1 and 100000 unreal units, where a 1 metre crate should read about 100. StaticMesh assets carry the SM_ prefix. Normal maps use TC_NORMALMAP compression. The report is read only: it names what is wrong and mutates nothing.</desc>
<style>
 .n{fill:#12151C;stroke:#2A3242;stroke-width:2;rx:6}
 .ttl{font:600 34px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .lab{font:600 30px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .sub{font:400 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .k{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB;letter-spacing:.08em}
 .mono{font:400 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB}
 .row{font:600 28px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .gate{font:600 28px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#D99A5E}
</style>
<g>
 <text class="k" x="16" y="36">PRE-FLIGHT REPORT</text>
 <text class="ttl" x="16" y="76">Checked before an asset is trusted,</text>
 <text class="ttl" x="16" y="114">with the thresholds written down</text>

 <rect class="n" x="16" y="136" width="688" height="92"/>
 <text class="row" x="36" y="174">Triangle budget</text>
 <text class="mono" x="684" y="174" text-anchor="end">300 to 1500 tris</text>
 <text class="sub" x="36" y="206">props, LOD0</text>

 <rect class="n" x="16" y="240" width="688" height="92"/>
 <text class="row" x="36" y="278">Scale drift</text>
 <text class="mono" x="684" y="278" text-anchor="end">longest axis 1 to 100000 uu</text>
 <text class="sub" x="36" y="310">a 1 m crate should read about 100 uu</text>

 <rect class="n" x="16" y="344" width="688" height="122"/>
 <text class="row" x="36" y="382">Naming contract</text>
 <text class="mono" x="684" y="382" text-anchor="end">SM_ prefix</text>
 <text class="sub" x="36" y="414">so the folder contract between</text>
 <text class="sub" x="36" y="444">the two programs holds</text>

 <rect class="n" x="16" y="478" width="688" height="92"/>
 <text class="row" x="36" y="516">Normal map compression</text>
 <text class="mono" x="684" y="516" text-anchor="end">TC_NORMALMAP</text>
 <text class="sub" x="36" y="548">the flag the green-channel slice depends on</text>

 <text class="gate" x="16" y="610">Read only. It reports and never mutates,</text>
 <text class="gate" x="16" y="644">so the report is evidence rather than</text>
 <text class="gate" x="16" y="678">a repair that hides the fault.</text>
</g></svg>
