<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" height="860" role="img" aria-labelledby="t d">
<title id="t">One slice: flip the green channel, but only on normal maps</title>
<desc id="d">Blender bakes tangent space normals in OpenGL convention with green pointing up. A check asks whether the file is a normal map. If yes, the green channel inverts for Unreal's DirectX convention. If no, the texture passes through untouched. The earlier script flipped every texture, which corrupted base colour and roughness.</desc>
<style>
 .n{fill:#12151C;stroke:#2A3242;stroke-width:2;rx:6}
 .ttl{font:600 34px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .lab{font:600 30px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .sub{font:400 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .k{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB;letter-spacing:.08em}
 .mono{font:400 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8792A0}
 .gate{font:600 28px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#D99A5E}
 .yes{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB;letter-spacing:.08em}
 .no{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8792A0;letter-spacing:.08em}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5A6675"/></marker></defs>
<g>
 <text class="k" x="16" y="36">THE SLICE</text>
 <text class="ttl" x="16" y="76">One behaviour, one failing test,</text>
 <text class="ttl" x="16" y="114">nothing else</text>

 <rect class="n" x="16" y="136" width="600" height="100"/>
 <text class="lab" x="36" y="172">Blender bake</text>
 <text class="sub" x="36" y="202">tangent space, OpenGL</text>
 <text class="mono" x="36" y="228">green = +Y</text>

 <path d="M316 236 V262" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>

 <rect class="n" x="16" y="266" width="600" height="100" style="stroke:#D99A5E"/>
 <text class="lab" x="36" y="302">Is this a normal map?</text>
 <text class="mono" x="36" y="332">is_normal_map(basename)</text>
 <text class="sub" x="36" y="358">the whole slice is this one question</text>

 <path d="M316 366 V392" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
 <text class="yes" x="334" y="388">YES</text>

 <rect class="n" x="16" y="396" width="600" height="100" style="stroke:#5FCEDB"/>
 <text class="lab" x="36" y="432">Invert green</text>
 <text class="sub" x="36" y="462">Unreal reads DirectX</text>
 <text class="mono" x="36" y="488">green = -Y</text>

 <path d="M616 316 H660 V576 H620" fill="none" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
 <text class="no" x="672" y="470">NO</text>

 <rect class="n" x="16" y="526" width="600" height="100"/>
 <text class="lab" x="36" y="562">Pass through untouched</text>
 <text class="sub" x="36" y="592">base colour, roughness,</text>
 <text class="sub" x="36" y="618">anything not a normal map</text>

 <rect x="16" y="656" width="688" height="190" fill="#12151C" stroke="#2A3242" stroke-width="2" rx="6"/>
 <text class="gate" x="36" y="692">The bug the test exists to catch:</text>
 <text class="gate" x="36" y="726">the old script flipped every texture.</text>
 <text class="sub" x="36" y="762">Surfaces lit wrong is the loud failure.</text>
 <text class="sub" x="36" y="792">A blanket flip quietly corrupting base colour</text>
 <text class="sub" x="36" y="822">is the expensive one.</text>
</g></svg>
