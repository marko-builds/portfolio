<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="t d">
<title id="t">Insert, 23505, next candidate</title>
<desc id="d">A ladder of insert attempts read from the create-project route. Attempt 1 inserts my-app and gets 23505. Attempt 2 inserts my-app-2 and gets 23505. Attempt 3 inserts my-app-3 and gets 201 created, marked in cyan as the usual exit. Attempts 4 to 9 are collapsed. Attempt 10, my-app-10, is the last rung. If all ten collide, the route answers 409 CONFLICT with the message: Could not generate a unique URL for this project name. Try a different name. A footer names the constant MAX_SLUG_ATTEMPTS = 10 in src/lib/slug.ts.</desc>
<style>
 .bg{fill:#12151C}
