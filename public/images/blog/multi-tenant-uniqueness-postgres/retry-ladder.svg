<text class="mono" x="36" y="200">1</text><text class="mono" x="200" y="200">my-app</text><text class="mono am" x="470" y="200">23505</text>
<text class="mono" x="36" y="252">2</text><text class="mono" x="200" y="252">my-app-2</text><text class="mono am" x="470" y="252">23505</text>
<rect x="26" y="270" width="668" height="52" fill="none" stroke="#5FCEDB" stroke-width="2" rx="6"/>
<text class="mono cy" x="36" y="304">3</text><text class="mono cy" x="200" y="304">my-app-3</text><text class="mono cy" x="470" y="304">201 created</text>
