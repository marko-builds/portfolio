<text class="monod" x="36" y="416">4 to 9</text><text class="monod" x="200" y="416">my-app-4 ...</text><text class="monod" x="470" y="416">23505</text>
<text class="mono" x="36" y="468">10</text><text class="mono" x="200" y="468">my-app-10</text><text class="mono am" x="470" y="468">23505</text>
<text class="sub" x="36" y="506">the last rung</text>

