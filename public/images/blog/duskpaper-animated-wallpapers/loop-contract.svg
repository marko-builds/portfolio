<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5A6675"/></marker></defs>
<text class="k" x="16" y="36">THE LOOP CONTRACT</text>
<text class="ttl" x="16" y="76">frame(t) closes on itself</text>
<rect class="n" x="16" y="100" width="688" height="150"/>
<text class="code" x="36" y="140">tau = 2*pi*t / period</text>
<text class="code" x="36" y="180">motion = sum S*cos(m*tau) + C*sin(m*tau)</text>
<text class="amb" x="36" y="224">m is an integer: 1, 2, 3 ...</text>
