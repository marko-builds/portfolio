<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" width="720" height="820" role="img" aria-labelledby="t d">
<title id="t">The loop contract: frame(t) built from integer-frequency harmonics closes on itself at t equals period</title>
<desc id="d">A code panel shows tau equals two pi t over period and every motion term as a sum of sine and cosine of m times tau with integer m. Below it, three sine waves with frequencies one, two and three are drawn across one period; each starts and ends at exactly the same height, marked with dots at t equals zero and t equals period. A gate at the bottom reads: every engine asserts frame(0) and frame(period) differ by at most 1 per channel.</desc>
