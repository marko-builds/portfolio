<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-labelledby="t d">
<title id="t">One product, four repos: the app on Vercel and three satellites</title>
<desc id="d">A map of DeployLog's four repos. At the top, the app on Vercel: dashboard, public changelog pages and the API, with keys that start with dk_. Below it, three satellites hang off the same API: the widget on Cloudflare Pages, which ships when Pages runs the build; the CLI on npm, which ships when a version is published; and the Action on the GitHub Marketplace, which ships when a release is tagged. A line at the bottom reads: merged is where shipping starts.</desc>
<style>
 .bg{fill:#12151C}
 .n{fill:#0B0E15;stroke:#2A3242;stroke-width:2;rx:6}
 .ttl{font:600 34px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .lab{font:600 30px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E4E9EC}
 .sub{font:400 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792A0}
 .k{font:600 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5FCEDB;letter-spacing:.08em}
 .gate{font:600 28px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#D99A5E}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5A6675"/></marker></defs>
<rect class="bg" width="720" height="900"/>
<text class="k" x="16" y="36">FOUR REPOS</text>
<text class="ttl" x="16" y="76">One product, four deploy targets</text>
<rect class="n" x="16" y="100" width="688" height="150" style="stroke:#5FCEDB"/>
<text class="k" x="36" y="136">01  VERCEL</text>
<text class="lab" x="36" y="172">deploylog, the app</text>
<text class="sub" x="36" y="204">dashboard, public changelog pages, the API</text>
<text class="sub" x="36" y="236">every caller authenticates with a dk_ key</text>
<path d="M40 250 V735" stroke="#5A6675" stroke-width="2" fill="none"/>
<path d="M40 375 H76" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
<path d="M40 555 H76" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
<path d="M40 735 H76" stroke="#5A6675" stroke-width="2" marker-end="url(#a)"/>
<rect class="n" x="80" y="300" width="624" height="150"/>
<text class="k" x="100" y="336">02  CLOUDFLARE PAGES</text>
<text class="lab" x="100" y="372">deploylog-widget</text>
<text class="sub" x="100" y="404">one script tag, about 4 KB gzipped</text>
<text class="sub" x="100" y="436">ships when Pages runs the build</text>
<rect class="n" x="80" y="480" width="624" height="150"/>
<text class="k" x="100" y="516">03  NPM</text>
<text class="lab" x="100" y="552">deploylog-cli</text>
<text class="sub" x="100" y="584">npm i -g deploylog, short alias dpl</text>
<text class="sub" x="100" y="616">ships when a version is published</text>
<rect class="n" x="80" y="660" width="624" height="150"/>
<text class="k" x="100" y="696">04  GITHUB MARKETPLACE</text>
<text class="lab" x="100" y="732">deploylog-action</text>
<text class="sub" x="100" y="764">uses: deploylogdev/action@v1</text>
<text class="sub" x="100" y="796">ships when a release is tagged</text>
<text class="gate" x="16" y="868">Merged is where shipping starts, not where it ends.</text>
</svg>
