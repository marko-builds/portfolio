 .t{font:600 32px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e4e9ec}
 .k{font:600 26px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5fcedb;letter-spacing:.05em}
 .l{font:400 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e4e9ec}
 .lb{font:600 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e4e9ec}
 .d{font:400 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8792a0}
 .m{font:500 26px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e4e9ec}
 .md{font:500 26px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8792a0}
 .w{font:700 26px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#ffffff}
 .p{fill:#0b0e15;stroke:#2a3242;stroke-width:1.5}
</style>
