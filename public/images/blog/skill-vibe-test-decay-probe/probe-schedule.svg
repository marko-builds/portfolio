<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="720" height="660" role="img" aria-labelledby="t d">
<title id="t">The 10-turn probe schedule with context tokens from conversation 1</title>
<desc id="d">A strip of ten rows, one per turn. Turn 1 is the baseline probe with the base task at 31,925 context tokens. Turns 2 to 5 are fillers: refrigeration, a lighthouse short story, a Japan trip, the metric system. Turn 6 is a probe at 37,990 tokens. Turn 7 is a filler about dinner ideas. Turn 8 is a probe at 39,384 tokens. Turn 9 is a filler about photosynthesis. Turn 10 is a probe at 40,979 tokens.</desc>
