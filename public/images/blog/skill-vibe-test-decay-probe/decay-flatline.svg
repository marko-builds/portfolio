<text class="m" x="204" y="528" text-anchor="middle">~38k</text>
<text class="m" x="350" y="528" text-anchor="middle">~48k</text>
<text class="m" x="496" y="528" text-anchor="middle">~52k</text>
<text class="m" x="642" y="528" text-anchor="middle">~54k</text>
<rect class="p" x="24" y="552" width="672" height="192" rx="6"/>
<circle cx="52" cy="577" r="8" fill="#5fcedb"/>
<text class="d" x="72" y="586">Is my skills index stale? Check whether</text>
<text class="d" x="48" y="614">CAPABILITIES.md still matches what is actually</text>
<text class="d" x="48" y="642">on disk.</text>
<rect x="44" y="660" width="16" height="16" fill="#d99a5e"/>
<text class="d" x="72" y="674">Run a structural health check of my capability</text>
<text class="d" x="48" y="702">layer - skills, scripts, and the index - and tell me</text>
<text class="d" x="48" y="730">what has drifted.</text>
