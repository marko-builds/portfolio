<circle cx="350" cy="375" r="8" fill="#5fcedb" stroke="#0b0e15" stroke-width="2"/>
<path d="M339 330 L361 352 M361 330 L339 352" stroke="#d0342c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
<path d="M339 364 L361 386 M361 364 L339 386" stroke="#d0342c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
<rect x="488" y="333" width="16" height="16" fill="#d99a5e" stroke="#0b0e15" stroke-width="2"/>
