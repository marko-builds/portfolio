<text class="t" x="24" y="76">Does capabilities-health still steer</text>
<text class="t" x="24" y="112">sonnet as the context fills?</text>
<rect x="24" y="128" width="672" height="80" rx="8" fill="#d0342c"/>
<text class="w" x="360" y="162" text-anchor="middle">BASELINE GATE BYPASSED: turn 1 already</text>
<text class="w" x="360" y="194" text-anchor="middle">failed, so this is not a decay curve</text>
<rect class="p" x="24" y="224" width="672" height="316" rx="6"/>
<path d="M156 266 H676" stroke="#2a3242" stroke-width="1.5" stroke-dasharray="4 5"/>
<text class="lb" x="146" y="275" text-anchor="end">PASS</text>
<path d="M156 358 H676" stroke="#2a3242" stroke-width="1.5" stroke-dasharray="4 5"/>
<text class="lb" x="146" y="367" text-anchor="end">FAIL</text>
